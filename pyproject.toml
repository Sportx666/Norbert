[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firstthings"
version = "0.1.0"
description = "Personal accountability assistant: weekly plan, check-ins, ledger, replanning."
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]>=21.6,<23",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "PyYAML>=6",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
firstthings = "firstthings.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
firstthings = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
